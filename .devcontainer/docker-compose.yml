services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/OpenLinkToken-Truveta-Extension:cached

      - type: bind
        source: "${OPENLINKTOKEN_PATH:-./empty/OpenLinkToken}"
        target: /workspaces/OpenLinkToken
        bind:
          create_host_path: true

      - openlinktoken-local:/home/vscode/.local
      - openlinktoken-cache:/home/vscode/.cache
      - openlinktoken-copilot:/home/vscode/.copilot
      - openlinktoken-vscode-server:/home/vscode/.vscode-server
      - openlinktoken-vscode-insiders:/home/vscode/.vscode-server-insiders
      - openlinktoken-config:/home/vscode/.config
    user: vscode:vscode
    environment:
      PUBLIC_GH_TOKEN: ${PUBLIC_GH_TOKEN:-}
      UV_PROJECT_ENVIRONMENT: /home/vscode/.local/share/openlinktoken-ext-truveta/.venv
    # Keeps the container running so devcontainer tooling can attach
    command: sleep infinity

volumes:
  openlinktoken-local:
    name: openlinktoken-local
  openlinktoken-cache:
    name: openlinktoken-cache
  openlinktoken-copilot:
    name: openlinktoken-copilot
  openlinktoken-vscode-server:
    name: openlinktoken-vscode-server
  openlinktoken-vscode-insiders:
    name: openlinktoken-vscode-insiders
  openlinktoken-config:
    name: openlinktoken-config
