repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: local
    hooks:
      - id: python-docstrings
        name: Check Python class and function docstrings
        entry: python3 tools/check_python_docstrings.py
        language: system
        files: ^src/main/.*\.py$
        exclude: ^src/main/openlinktoken_ext_truveta/openlink_token_service_client/(client|types)\.py$
        types: [python]
