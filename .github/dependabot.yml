# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Delay routine version updates without delaying security updates.
    cooldown:
      default-days: 7
    groups:
      weekly-batch:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "python"

  # Keep pip-based updates for the package manifests while the repo also tracks
  # a root uv.lock for contributor tooling and workspace automation.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      weekly-batch:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      weekly-batch:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    target-branch: "develop"
    labels:
      - "dependencies"
