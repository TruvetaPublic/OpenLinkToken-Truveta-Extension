name: Create Release on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n '/^\[bumpversion\]/,/^\[/p' .bumpversion.cfg \
            | grep "^current_version" \
            | cut -d'=' -f2 \
            | tr -d ' ')
          VERSION=$(printf '%s' "$VERSION" | tr -d '<>' | tr -d '\r\n')

          if [ -z "$VERSION" ]; then
            echo "Failed to determine a valid version from .bumpversion.cfg" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
          echo "Tag: v${VERSION}"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          TAG: v${{ steps.get_version.outputs.version }}
        with:
          script: |
            const tag = process.env.TAG;
            const sha = context.sha;

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release ${tag} already exists: ${release.data.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag ${tag} already exists`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
              core.info(`Created tag ${tag} at ${sha}`);
            }

            let releaseNotes;
            try {
              const notes = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
              });
              releaseNotes = notes.data.body;
            } catch (error) {
              core.warning(`Could not generate release notes: ${error.message}`);
              releaseNotes = `Release ${tag}`;
            }

            release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: releaseNotes,
              draft: false,
              prerelease: false,
            });

            core.info(`Created release: ${release.data.html_url}`);

      - name: Summary
        run: |
          echo "Release v${{ steps.get_version.outputs.version }} is ready for asset builds."
