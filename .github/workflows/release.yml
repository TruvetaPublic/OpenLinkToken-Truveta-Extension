name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., 0.1.0)"
                required: true
                type: string

permissions:
    contents: read

jobs:
    build-and-release:
        name: Build wheel and publish to GitHub Releases
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              uses: astral-sh/setup-uv@v8.2.0
              with:
                  enable-cache: true

            - name: Install package with dev extras
              run: uv pip install --system -e ".[dev]"

            - name: Build wheel and sdist
              run: uv build

            - name: Resolve release tag
              id: tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create git tag (workflow_dispatch only)
              if: github.event_name == 'workflow_dispatch'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${{ steps.tag.outputs.tag }}"
                  git push origin "${{ steps.tag.outputs.tag }}"

            - name: Upload built distributions as workflow artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: openlinktoken-ext-truveta-${{ steps.tag.outputs.tag }}
                  path: |
                      dist/*.whl
                      dist/*.tar.gz

            - name: Publish to GitHub Releases
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  generate_release_notes: true
                  files: |
                      dist/*.whl
                      dist/*.tar.gz

    build-standalone:
        name: Build standalone executable (${{ matrix.os }})
        needs: build-and-release
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: openlinktoken-truveta-linux-amd64
                    - os: windows-latest
                      artifact_name: openlinktoken-truveta-windows-amd64
                    - os: macos-latest
                      artifact_name: openlinktoken-truveta-macos-arm64
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              uses: astral-sh/setup-uv@v8.2.0
              with:
                  enable-cache: true

            - name: Install package and PyInstaller
              run: |
                  uv pip install --system -e ".[dev]"
                  uv pip install --system pyinstaller

            - name: Resolve release tag
              id: tag
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build standalone executable
              shell: bash
              run: |
                  pyinstaller --onefile --name "${{ matrix.artifact_name }}" \
                    --hidden-import openlinktoken_ext_truveta \
                    --collect-submodules openlinktoken_ext_truveta \
                    --collect-submodules openlinktoken \
                    --collect-submodules openlinktoken_cli \
                    -c -y \
                    $(python -c "import openlinktoken_cli.__main__; print(openlinktoken_cli.__main__.__file__)")

            - name: Upload standalone artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: dist/${{ matrix.artifact_name }}*

            - name: Attach standalone to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  files: dist/${{ matrix.artifact_name }}*
