name: Build Release Assets

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: false
        type: string
  workflow_run:
    workflows: ["Create Release on Merge"]
    types: [completed]

permissions:
  contents: read

jobs:
  release-info:
    uses: ./.github/workflows/release-context.yml
    secrets: inherit
    with:
      lookup-release: true
      release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.version && format('v{0}', github.event.inputs.version) || '' }}

  build-and-release:
    name: Build wheel and attach to GitHub Release
    needs: release-info
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-info.outputs.version }}
      TAG: ${{ needs.release-info.outputs.tag }}
      RELEASE_FOUND: ${{ needs.release-info.outputs['release-found'] }}
      RELEASE_ID: ${{ needs.release-info.outputs['release-id'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs['release-found'] == 'true' && needs.release-info.outputs.tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]"

      - name: Build wheel and sdist
        run: uv build

      - name: Generate extension release manifests
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t wheel_paths < <(
            find dist -maxdepth 1 -type f -name '*.whl' -print | sort
          )
          if [ "${#wheel_paths[@]}" -ne 1 ]; then
            printf 'Expected exactly one wheel from uv build; found %s:\n' \
              "${#wheel_paths[@]}" >&2
            printf '  %s\n' "${wheel_paths[@]}" >&2
            exit 1
          fi
          wheel_path="${wheel_paths[0]}"
          test -f "$wheel_path"
          python -m openlinktoken_ext_truveta.util.extension_manifests \
            --version "${VERSION}" \
            --wheel "$wheel_path" \
            --output-dir release-assets

      - name: Upload built distributions as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openlinktoken-ext-truveta-${{ env.TAG }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/*

      - name: Upload distributions to GitHub Release
        if: env.RELEASE_FOUND == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = '${{ env.TAG }}';
            let releaseId = '${{ env.RELEASE_ID }}';

            if (!releaseId) {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              releaseId = release.data.id;
            }

            const files = [
              ...fs.readdirSync('dist')
                .filter((name) => name.endsWith('.whl') || name.endsWith('.tar.gz'))
                .map((name) => path.join('dist', name)),
              ...fs.readdirSync('release-assets')
                .map((name) => path.join('release-assets', name)),
            ];

            if (files.length === 0) {
              throw new Error('No wheel or source distribution found in dist');
            }

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            const existingAssets = new Map(release.data.assets.map((asset) => [asset.name, asset.id]));

            for (const filePath of files) {
              const name = path.basename(filePath);
              const existingAssetId = existingAssets.get(name);

              if (existingAssetId) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existingAssetId,
                });
              }

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name,
                data: fs.readFileSync(filePath),
              });

              core.info(`Uploaded ${name}`);
            }

  build-standalone:
    name: Build standalone distributable (${{ matrix.os }})
    needs: [release-info, build-and-release]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    env:
      VERSION: ${{ needs.release-info.outputs.version }}
      TAG: ${{ needs.release-info.outputs.tag }}
      RELEASE_FOUND: ${{ needs.release-info.outputs['release-found'] }}
      RELEASE_ID: ${{ needs.release-info.outputs['release-id'] }}
      OLT_ML1_MODEL_TAG: v1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-info.outputs['release-found'] == 'true' && needs.release-info.outputs.tag || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install package and PyInstaller
        run: |
          uv pip install --system -e ".[release]"
          uv pip install --system -r pyinstaller-requirements.txt

      - name: Verify macOS arm64 runner
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "This release requires an arm64 macOS runner; found $(uname -m)." >&2
            exit 1
          fi

      - name: Build standalone bundle (macOS arm64)
        if: runner.os == 'macOS'
        run: OLT_TARGET_ARCH=arm64 pyinstaller --clean --noconfirm openlinktoken-ext-truveta.spec

      - name: Build standalone bundle (Linux / Windows)
        if: runner.os != 'macOS'
        run: pyinstaller --clean --noconfirm openlinktoken-ext-truveta.spec

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.3

      - name: Retrieve and verify ML1 OCI assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/model-assets
          oras pull "ghcr.io/truvetapublic/openlinktoken-ml1-assets:${OLT_ML1_MODEL_TAG}" \
            --output smoke/model-assets
          python - <<'PY'
          from openlinktoken_ext_truveta.util.inferencing_assets import (
              ML1_ASSET_DESTINATION,
              copy_ml1_assets,
          )

          copy_ml1_assets(
              "smoke/model-assets",
              f"dist/olt/_internal/{ML1_ASSET_DESTINATION}",
          )
          PY

      - name: Smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p smoke
          cp src/test/resources/launch/sample.csv smoke/input.csv
          ./dist/olt/olt --help
          ./dist/olt/olt truveta --help
          SMOKE_HOME="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_HOME"' EXIT
          HOME="$SMOKE_HOME" XDG_CONFIG_HOME="$SMOKE_HOME/.config" \
            ./dist/olt/olt truveta logout
          python scripts/smoke_independent_extension_update.py \
            --cli dist/olt/olt \
            --manifest-url "https://github.com/TruvetaPublic/OpenLinkToken-Truveta-Extension/releases/download/${TAG}/openlinktoken-ext-truveta-bootstrap.json"
          ./dist/olt/olt generate-key-pair --name recipient --force
          ./dist/olt/olt initiate-exchange --name smoke --public-key "$HOME/.openlinktoken/recipient.public.pem" --output smoke/smoke.exchange.json --hashingsecret secret
          ./dist/olt/olt tokenize -i smoke/input.csv -o smoke/out.csv --exchange-config smoke/smoke.exchange.json --private-key "$HOME/.openlinktoken/smoke.private.pem"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item src\test\resources\launch\sample.csv smoke\input.csv
          .\dist\olt\olt.exe --help
          .\dist\olt\olt.exe truveta --help
          $smokeHome = Join-Path $env:RUNNER_TEMP "olt-truveta-smoke"
          New-Item -ItemType Directory -Force -Path $smokeHome | Out-Null
          $env:HOME = $smokeHome
          $env:APPDATA = $smokeHome
          $env:XDG_CONFIG_HOME = Join-Path $smokeHome ".config"
          .\dist\olt\olt.exe truveta logout
          python scripts\smoke_independent_extension_update.py `
            --cli dist\olt\olt.exe `
            --manifest-url "https://github.com/TruvetaPublic/OpenLinkToken-Truveta-Extension/releases/download/$env:TAG/openlinktoken-ext-truveta-bootstrap.json"
          .\dist\olt\olt.exe generate-key-pair --name recipient --force
          .\dist\olt\olt.exe initiate-exchange --name smoke --public-key "$HOME/.openlinktoken/recipient.public.pem" --output smoke\smoke.exchange.json --hashingsecret secret
          .\dist\olt\olt.exe tokenize -i smoke\input.csv -o smoke\out.csv --exchange-config smoke\smoke.exchange.json --private-key "$HOME/.openlinktoken/smoke.private.pem"

      - name: Prepare release assets
        shell: bash
        run: |
          python -m openlinktoken_ext_truveta.util.release_assets \
            --version "${{ env.VERSION }}" \
            --runner-os "${{ runner.os }}" \
            --dist-dir dist \
            --output-dir release-assets

      - name: Verify release ZIP omits ML1 assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          from pathlib import Path

          asset_suffix = (
              "_internal",
              "openlinktoken",
              "core",
              "ai",
              "tokens",
          )
          model_files = {
              "asset-manifest.json",
              "model.onnx",
              "model.onnx.data",
              "tokenizer.json",
          }
          archives = sorted(Path("release-assets").glob("olt-truveta-*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one standalone ZIP, found {len(archives)}")
          with zipfile.ZipFile(archives[0]) as archive:
              included_assets = [
                  name
                  for name in archive.namelist()
                  if Path(name).parts[-6:-1] == asset_suffix
                  and Path(name).name in model_files
              ]
          if included_assets:
              raise SystemExit(
                  f"Standalone release ZIP unexpectedly includes ML1 assets: {included_assets}"
              )
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: olt-truveta-${{ env.VERSION }}-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload release assets to GitHub Release
        if: env.RELEASE_FOUND == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const assetDir = 'release-assets';
            const tag = '${{ env.TAG }}';
            let releaseId = '${{ env.RELEASE_ID }}';

            if (!releaseId) {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              releaseId = release.data.id;
            }

            const files = fs.readdirSync(assetDir)
              .map((name) => path.join(assetDir, name))
              .filter((filePath) => fs.statSync(filePath).isFile());

            if (files.length === 0) {
              throw new Error(`No release assets found in ${assetDir}`);
            }

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            const existingAssets = new Map(release.data.assets.map((asset) => [asset.name, asset.id]));

            for (const filePath of files) {
              const name = path.basename(filePath);
              const size = fs.statSync(filePath).size;
              const existingAssetId = existingAssets.get(name);

              if (existingAssetId) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existingAssetId,
                });
              }

              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name,
                data: fs.readFileSync(filePath),
              });

              console.log(`Uploaded ${name} (${size} bytes)`);
            }
