name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test, and Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Git LFS
        run: git lfs install --skip-repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]"

      - name: Lint with flake8
        run: flake8 src/main src/test

      - name: Check formatting with autoflake
        run: autoflake --check --recursive --remove-all-unused-imports --remove-unused-variables src/main src/test

      - name: Run tests with pytest
        run: |
          pytest src/test -v --junitxml=test-results-${{ matrix.python-version }}.xml
          pytest tools/tests -v --junitxml=test-results-tools-${{ matrix.python-version }}.xml

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test-results-*.xml
          check_name: Test Results (Python ${{ matrix.python-version }})
          comment_mode: off

      - name: Build distribution
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
          retention-days: 7
