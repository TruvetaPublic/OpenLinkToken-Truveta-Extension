name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test, and Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]"

      - name: Lint with flake8
        run: flake8 src/main src/test

      - name: Check formatting with autoflake
        run: autoflake --check --recursive --remove-all-unused-imports --remove-unused-variables src/main src/test

      - name: Run tests with pytest
        run: pytest src/test -v --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: test-results-${{ matrix.python-version }}.xml
          check_name: Test Results (Python ${{ matrix.python-version }})
          comment_mode: off

      - name: Build distribution
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
          retention-days: 7
