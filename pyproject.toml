[project]
name = "openlinktoken-ext-truveta"
version = "1.0.0"
requires-python = ">=3.10"
description = "Open Link Token extension for Truveta-specific CLI commands"
dependencies = ["requests==2.34.2", "cryptography==50.0.0", "httpx==0.28.1", "pydantic==2.13.4"]

[project.entry-points."openlinktoken.extensions"]
truveta = "openlinktoken_ext_truveta.extension:TruvetaExtension"

[project.optional-dependencies]
dev = [
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@develop#subdirectory=lib/python/openlinktoken-cli",
    "pytest==9.1.1",
    "bump2version==1.0.1",
    "build==1.5.0",
    "autoflake==2.3.3",
    "flake8==7.3.0",
]
# Pin the model-enabled OpenLinkToken source so the standalone build includes the
# same CLI/core-AI code and assets as the upstream self-contained build.
release = [
    "openlinktoken @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@54f85797046373bf2e661f8e8865327ba73d5d75#subdirectory=lib/python/openlinktoken",
    "openlinktoken-core-ai @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@54f85797046373bf2e661f8e8865327ba73d5d75#subdirectory=lib/python/openlinktoken-core-ai",
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@54f85797046373bf2e661f8e8865327ba73d5d75#subdirectory=lib/python/openlinktoken-cli",
]

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/main"]

[tool.pytest.ini_options]
pythonpath = ["src/main"]
testpaths = ["src/test"]
norecursedirs = [".venv", "node_modules", "__pycache__", ".git"]
