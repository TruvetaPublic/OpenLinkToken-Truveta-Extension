[project]
name = "openlinktoken-ext-truveta"
version = "1.0.0"
requires-python = ">=3.10"
description = "Open Link Token extension for Truveta-specific CLI commands"
dependencies = [
    "requests==2.34.2",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "packaging>=26.3,<27.0",
]

[project.entry-points."openlinktoken.extensions"]
truveta = "openlinktoken_ext_truveta.extension:TruvetaExtension"

[project.optional-dependencies]
dev = [
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@v2.2.0#subdirectory=lib/python/openlinktoken-cli",
    "pytest==9.1.1",
    "bump2version==1.0.1",
    "build==1.6.1",
    "autoflake==2.4.0",
    "flake8==7.3.0",
]
# Use OpenLinkToken's main branch so release packages and assets stay aligned.
release = [
    "openlinktoken @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@main#subdirectory=lib/python/openlinktoken",
    "openlinktoken-core-ai @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@main#subdirectory=lib/python/openlinktoken-core-ai",
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@main#subdirectory=lib/python/openlinktoken-cli",
]

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/main"]

[tool.pytest.ini_options]
pythonpath = ["src/main"]
testpaths = ["src/test"]
norecursedirs = [".venv", "node_modules", "__pycache__", ".git"]
