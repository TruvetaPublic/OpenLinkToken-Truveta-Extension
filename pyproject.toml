[project]
name = "openlinktoken-ext-truveta"
version = "1.0.0"
requires-python = ">=3.10"
description = "Open Link Token extension for Truveta-specific CLI commands"
dependencies = ["requests==2.33.0", "cryptography==46.0.7", "httpx==0.28.1", "pydantic==2.13.4"]

[project.entry-points."openlinktoken.extensions"]
truveta = "openlinktoken_ext_truveta.extension:TruvetaExtension"

[project.optional-dependencies]
dev = [
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@develop#subdirectory=lib/python/openlinktoken-cli",
    "pytest==8.3.3",
    "bump2version==1.0.1",
    "build==1.2.2",
    "autoflake==2.3.1",
    "flake8==7.1.1",
]
# Pinned upstream refs used by the release workflow to produce reproducible standalone binaries.
# Bump these to the desired OpenLinkToken release tag before cutting a release.
release = [
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@v1.13.2#subdirectory=lib/python/openlinktoken-cli",
]

[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/main"]

[tool.pytest.ini_options]
pythonpath = ["src/main"]
testpaths = ["src/test"]
