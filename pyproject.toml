[project]
name = "openlinktoken-ext-truveta"
version = "1.0.0"
requires-python = ">=3.10"
description = "Open Link Token extension for Truveta-specific CLI commands"
dependencies = ["requests==2.33.0", "cryptography==49.0.0", "httpx==0.28.1", "pydantic==2.13.4"]

[project.entry-points."openlinktoken.extensions"]
truveta = "openlinktoken_ext_truveta.extension:TruvetaExtension"

[project.optional-dependencies]
dev = [
    "openlinktoken-cli @ file:///workspaces/OpenLinkToken/lib/python/openlinktoken-cli",
    "openlinktoken-core-ai @ file:///workspaces/OpenLinkToken/lib/python/openlinktoken-core-ai",
    "pytest==9.0.3",
    "bump2version==1.0.1",
    "build==1.2.2",
    "autoflake==2.3.1",
    "flake8==7.3.0",
]
# Pinned upstream refs used by the release workflow to produce reproducible standalone binaries.
# Bump these to the desired OpenLinkToken release tag before cutting a release.
release = [
    "openlinktoken-cli @ file:///workspaces/OpenLinkToken/lib/python/openlinktoken-cli",
    "openlinktoken-core-ai @ file:///workspaces/OpenLinkToken/lib/python/openlinktoken-core-ai",
]

[build-system]
requires = ["setuptools==78.1.1", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/main"]

[tool.uv.sources]
openlinktoken-cli = { path = "/workspaces/OpenLinkToken/lib/python/openlinktoken-cli", editable = true }
openlinktoken-core-ai = { path = "/workspaces/OpenLinkToken/lib/python/openlinktoken-core-ai", editable = true }

[dependency-groups]
dev = [
    "openlinktoken-cli",
    "openlinktoken-core-ai",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src/main"]
testpaths = ["src/test"]
