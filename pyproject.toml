[project]
name = "openlinktoken-ext-truveta"
version = "1.0.0"
requires-python = ">=3.10"
description = "Open Link Token extension for Truveta-specific CLI commands"
dependencies = ["requests==2.33.0", "cryptography==50.0.0", "httpx==0.28.1", "pydantic==2.13.4"]

[project.entry-points."openlinktoken.extensions"]
truveta = "openlinktoken_ext_truveta.extension:TruvetaExtension"

[project.optional-dependencies]
dev = [
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@develop#subdirectory=lib/python/openlinktoken-cli",
    "pytest==9.1.1",
    "bump2version==1.0.1",
    "build==1.5.0",
    "autoflake==2.3.3",
    "flake8==7.3.0",
]
# Keep the release dependency aligned with the current OpenLinkToken develop branch
# to maintain compatibility with the extension's runtime and build environment.
release = [
    "openlinktoken-cli @ git+https://github.com/TruvetaPublic/OpenLinkToken.git@develop#subdirectory=lib/python/openlinktoken-cli",
]

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/main"]

[tool.pytest.ini_options]
pythonpath = ["src/main"]
testpaths = ["src/test"]
